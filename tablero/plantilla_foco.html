/* encabezado-fijo */
.enc-fijo{position:relative;z-index:30;margin:0 -1rem;padding:.5rem 1rem .75rem;background:rgba(247,248,250,.95);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
@media (min-width:640px){.enc-fijo{margin:0 -1.5rem;padding-left:1.5rem;padding-right:1.5rem}}
@media (min-width:768px){.enc-fijo{position:sticky;top:0}}
@media (min-width:1024px){.enc-fijo{margin:0 -2rem;padding-left:2rem;padding-right:2rem}}
.enc-caja{display:flex;flex-direction:column;gap:.875rem;border:1px solid rgba(226,232,240,.85);border-radius:.75rem;background:#fff;padding:1rem 1.25rem}
@media (min-width:768px){.enc-caja{flex-direction:row;align-items:center;justify-content:space-between;gap:1.5rem}}
.enc-titulo{min-width:0}
.enc-filtros{position:relative;display:flex;align-items:flex-end;gap:.625rem;flex-shrink:0}
.enc-corte{width:210px}
.enc-boton{display:inline-flex;align-items:center;gap:.5rem;height:2.5rem;padding:0 .875rem;border:1px solid #e2e8f0;border-radius:.5rem;background:#fff;color:#334155;font-size:.75rem;font-weight:600;white-space:nowrap;cursor:pointer;transition:background-color .15s,border-color .15s}
.enc-boton:hover{border-color:#cbd5e1;background:#f8fafc}
.enc-boton.activo{border-color:#fca5a5;background:rgba(254,242,242,.7);color:#7f1d1d}
.enc-boton svg{width:.875rem;height:.875rem}
.enc-boton .enc-flecha{transition:transform .15s}
.enc-boton.abierto .enc-flecha{transform:rotate(180deg)}
.enc-num{display:inline-flex;align-items:center;justify-content:center;min-width:1.25rem;height:1.25rem;padding:0 .35rem;border-radius:999px;background:#b91c1c;color:#fff;font-size:10px;font-weight:700}
.enc-panel{position:absolute;right:0;top:calc(100% + .5rem);width:min(380px,calc(100vw - 2rem));border:1px solid rgba(226,232,240,.9);border-radius:.75rem;background:#fff;padding:1rem;box-shadow:0 12px 32px -8px rgba(15,23,42,.18),0 4px 10px -4px rgba(15,23,42,.08)}
@media (max-width:767px){.enc-corte{flex:1;width:auto}.enc-panel{left:0;right:auto;width:100%}}
.enc-grid{display:grid;grid-template-columns:1fr;gap:.75rem}
.enc-acciones{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem;padding-top:.875rem;border-top:1px solid #f1f5f9}
.enc-sec,.enc-pri{display:inline-flex;align-items:center;gap:.375rem;height:2.25rem;padding:0 .875rem;border-radius:.5rem;font-size:.75rem;font-weight:600;cursor:pointer}
.enc-sec{border:1px solid #e2e8f0;background:#fff;color:#475569}
.enc-sec:hover:not(:disabled){background:#f8fafc;color:#0f172a}
.enc-sec:disabled{opacity:.4;cursor:default}
.enc-pri{border:1px solid #b91c1c;background:#b91c1c;color:#fff}
.enc-pri:hover{background:#991b1b}
.enc-sec svg{width:.875rem;height:.875rem}
/* tarjetas-panorama */
.kpi-grid{display:grid;gap:.75rem;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:768px){.kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1280px){.kpi-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.kpi{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;min-width:0;min-height:112px;padding:.875rem .625rem;border:1px solid rgba(226,232,240,.85);border-radius:.75rem;background:#fff;text-align:center;font:inherit;color:inherit;transition:border-color .15s}
button.kpi{cursor:pointer}
button.kpi:hover:not(:disabled){border-color:#cbd5e1}
button.kpi:disabled{cursor:default}
button.kpi:focus-visible{outline:2px solid #b91c1c;outline-offset:2px}
.kpi-l{font-size:12px;font-weight:500;line-height:1.25;color:#64748b}
.kpi-v{display:flex;align-items:center;justify-content:center;gap:.5rem}
.kpi-n{font-size:28px;font-weight:600;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.kpi-v svg{width:1.125rem;height:1.125rem;flex-shrink:0}
.kpi-s{font-size:11px;line-height:1.3;color:#64748b}
.kpi-slate .kpi-n{color:#0f172a}.kpi-slate svg{color:#94a3b8}
.kpi-teal .kpi-n{color:#115e59}.kpi-teal svg{color:#0f766e}
.kpi-indigo .kpi-n{color:#3730a3}.kpi-indigo svg{color:#4f46e5}
.kpi-sky .kpi-n{color:#075985}.kpi-sky svg{color:#0284c7}
.kpi-amber .kpi-n{color:#b45309}.kpi-amber svg{color:#d97706}
.kpi-red .kpi-n{color:#b91c1c}.kpi-red svg{color:#b91c1c}
/* graficas-llenan-celda */
.enc-graf{position:relative;flex:1 1 auto;width:100%}
.enc-svg{position:absolute;inset:0;display:block;width:100%;height:100%}
.enc-ley{display:flex;flex-wrap:wrap;justify-content:center;gap:.25rem 1rem;margin-top:.5rem;font-size:11px;line-height:1.4;color:#64748b}
.enc-ley span{display:inline-flex;align-items:center;gap:.375rem;white-space:nowrap}
.enc-ley b{font-weight:600}
.enc-ley i{display:inline-block;flex-shrink:0}
.enc-ley-dot{width:9px;height:9px;border-radius:50%}
.enc-ley-sq{width:8px;height:8px;border-radius:2px}
.enc-ley-dash{width:20px;height:0;border-top:2px dashed}
/* bandeja-encabezado-fijo */
.enc-bandeja{overflow:clip}
@media (min-width:640px){.enc-bandeja-tabla{overflow:visible}}
.enc-bandeja-cab{position:sticky;top:0;z-index:6;background:#fff}
.enc-bandeja thead th{position:sticky;top:var(--enc-cab-h,0px);z-index:5;background:#f8fafc;box-shadow:inset 0 -1px 0 #e2e8f0;white-space:normal;vertical-align:bottom;line-height:1.25}
.enc-bandeja thead th button{text-align:right}
.enc-bandeja thead th button span{min-width:0}
.enc-bandeja th:not(:first-child),.enc-bandeja td:not(:first-child){padding-left:6px;padding-right:6px}
.enc-bandeja th:first-child,.enc-bandeja td:first-child{padding-left:14px;padding-right:8px}
.enc-bandeja th:last-child,.enc-bandeja td:last-child{padding-right:14px}
@media (min-width:1280px){.enc-bandeja-grid{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}}
.enc-bandeja th:nth-child(2){width:76px}.enc-bandeja th:nth-child(3){width:76px}.enc-bandeja th:nth-child(4){width:68px}
.enc-bandeja th:nth-child(5){width:94px}.enc-bandeja th:nth-child(6){width:70px}
.enc-bandeja thead th span{-webkit-hyphens:auto;hyphens:auto}
.enc-bandeja thead th button{gap:3px}
.enc-bandeja td:nth-child(5) .font-medium{line-height:1.35}
@media (min-width:768px){.enc-bandeja-cab{top:var(--filter-bar-h,0px)}.enc-bandeja thead th{top:calc(var(--filter-bar-h,0px) + var(--enc-cab-h,0px))}}
/* detalle-meta-tarjetas */
.enc-met{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.enc-met-c{grid-column:span 2;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.375rem;min-width:0;padding:.875rem .75rem;text-align:center;border-right:1px solid #f1f5f9}
.enc-met-c:nth-child(3n){border-right:0}
.enc-met-c:nth-child(n+4){border-top:1px solid #f1f5f9}
.enc-met-l{font-size:11px;font-weight:500;line-height:1.3;color:#64748b}
.enc-met-v{font-size:1.125rem;font-weight:600;line-height:1.2;white-space:nowrap}
.enc-met-bar{width:100%;max-width:150px;height:6px;border-radius:999px;background:#f1f5f9;overflow:hidden}
.enc-met-bar i{display:block;height:100%;border-radius:999px;background:currentColor}
.enc-sem-v{color:#047857}.enc-sem-a{color:#b45309}.enc-sem-r{color:#b91c1c}.enc-sem-n{color:#475569}
.enc-sem-n .enc-met-bar i{background:#94a3b8}
.enc-met-ley{display:flex;flex-wrap:wrap;justify-content:center;gap:.25rem .875rem;font-size:11px;line-height:1.4;color:#64748b}
.enc-met-ley span{display:inline-flex;align-items:center;gap:.3rem;white-space:nowrap}
.enc-met-ley i{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor}

.enc-det{display:flex;flex-direction:column}
.enc-det>.enc-det-graf{order:10;margin-top:1.25rem;margin-bottom:0!important}
.enc-graf-2{margin-top:1.25rem}

.enc-det-cab{position:sticky;top:0;z-index:7;background:#fff;border-radius:.75rem .75rem 0 0}
@media (min-width:768px){.enc-det-cab{top:var(--filter-bar-h,0px)}}
/* actividades-grafica-emergente */
.enc-pop{position:fixed;z-index:60;pointer-events:none;background:#fff;border:1px solid #e2e8f0;border-radius:.75rem;box-shadow:0 16px 40px -12px rgba(15,23,42,.28),0 4px 12px -6px rgba(15,23,42,.12);padding:.75rem .875rem .625rem}
.enc-pop-cab{font-size:11px;line-height:1.4;color:#64748b}
.enc-pop-meta{font-weight:600;color:#991b1b}
.enc-pop-tit{margin-top:.125rem;font-size:12px;font-weight:600;line-height:1.35;color:#0f172a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.enc-pop-sub{margin:.375rem 0 .125rem;font-size:11px;color:#64748b}
.enc-pop svg{display:block;width:100%;height:auto}
.enc-pop-tot{margin-top:.125rem;text-align:center;font-size:11.5px;color:#334155}
.enc-pop-tot b{font-weight:700;color:#0f172a}
.enc-pop-ley{display:flex;flex-wrap:wrap;justify-content:center;gap:.25rem .875rem;margin-top:.375rem;font-size:11px;color:#64748b}
.enc-pop-ley span{display:inline-flex;align-items:center;gap:.3rem}
.enc-pop-ley i{display:inline-block;width:10px;height:10px;border-radius:2px}
.enc-acts{overflow:clip}
@media (min-width:1200px){.enc-acts-tabla{overflow:visible}}   /* más angosto, la tabla conserva su desplazamiento horizontal */
.enc-acts-cab{position:sticky;top:0;z-index:6;background:#fff}
.enc-acts thead th{position:sticky;top:var(--enc-cab-h,0px);z-index:5;background:#f8fafc;box-shadow:inset 0 -1px 0 #e2e8f0;vertical-align:bottom}
@media (min-width:768px){.enc-acts-cab{top:var(--filter-bar-h,0px)}.enc-acts thead th{top:calc(var(--filter-bar-h,0px) + var(--enc-cab-h,0px))}}
/* descargas-barra-lateral */
.enc-desc{margin-bottom:.875rem;padding-bottom:.875rem;border-bottom:1px solid #f1f5f9}
.enc-desc-tit{margin-bottom:.5rem;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#64748b}
.enc-desc-lbl{display:block;margin-bottom:.25rem;font-size:11px;font-weight:500;color:#475569}
.enc-desc-sel{width:100%;height:2.25rem;padding:0 .5rem;border:1px solid #e2e8f0;border-radius:.5rem;background:#fff;font-size:12px;color:#0f172a;cursor:pointer}
.enc-desc-sel:focus{outline:none;border-color:#b91c1c;box-shadow:0 0 0 2px rgba(185,28,28,.1)}
.enc-desc-lista{display:flex;flex-direction:column;gap:.375rem;margin-top:.625rem}
.enc-desc-btn{display:flex;align-items:center;gap:.5rem;padding:.45rem .6rem;border:1px solid #e2e8f0;border-radius:.5rem;background:#f8fafc;color:#334155;font-size:12px;font-weight:500;text-decoration:none;transition:border-color .15s,background-color .15s,color .15s}
.enc-desc-btn:hover{border-color:#fca5a5;background:#fef2f2;color:#7f1d1d}
.enc-desc-btn svg{width:14px;height:14px;flex-shrink:0}
.enc-desc-btn span{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.enc-desc-btn small{font-size:10px;font-weight:400;color:#94a3b8}
.enc-desc-sdp{align-self:flex-end;margin-top:-.125rem;font-size:10px;color:#64748b;text-decoration:underline}
.enc-desc-sdp:hover{color:#7f1d1d}
.enc-desc-vacio{margin-top:.5rem;font-size:11px;line-height:1.4;color:#94a3b8}
.enc-lateral{overflow-y:auto;overscroll-behavior:contain}
/* modo-oscuro */
.enc-tema{display:inline-flex;align-items:center;justify-content:center;width:2.5rem;height:2.5rem;flex-shrink:0;border:1px solid #e2e8f0;border-radius:.5rem;background:#fff;color:#475569;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s}
.enc-tema:hover{border-color:#cbd5e1;background:#f8fafc;color:#0f172a}
.enc-tema svg{width:1rem;height:1rem}
html.enc-oscuro{color-scheme:dark;
  --color-slate-50:#2b2a28;--color-slate-100:#34332f;--color-slate-200:#3a3936;--color-slate-300:#4a4844;
  --color-slate-400:#8a867e;--color-slate-500:#a29e96;--color-slate-600:#bcb8b0;--color-slate-700:#d3cfc7;
  --color-slate-800:#e4e1da;--color-slate-900:#f0eee9;
  --color-red-50:#3a2120;--color-red-100:#4a2523;--color-red-200:#6b2b28;--color-red-300:#8f3330;
  --color-red-700:#d84040;--color-red-800:#f07272;--color-red-900:#f8a5a5;
  --color-amber-50:#3a2f1c;--color-amber-200:#5c4520;--color-amber-300:#7a5a22;--color-amber-600:#d99a2b;
  --color-amber-700:#e9a93c;--color-amber-800:#f2bf5c;--color-amber-900:#f6cf80;--color-amber-950:#f8d99a;
  --color-teal-50:#18302d;--color-teal-100:#1d3a36;--color-teal-200:#265049;--color-teal-700:#2bb3a0;
  --color-teal-800:#5fd1c0;--color-teal-900:#8fe0d3;
  --color-sky-50:#182a36;--color-sky-200:#23465b;--color-sky-600:#38a3e0;--color-sky-800:#8fd0f5}
html.enc-oscuro body,html.enc-oscuro .bg-\[\#f7f8fa\]{background-color:#1f1e1d!important}
html.enc-oscuro .bg-white,html.enc-oscuro .hover\:bg-white:hover,html.enc-oscuro .focus\:bg-white:focus,html.enc-oscuro .disabled\:hover\:bg-white:disabled:hover{background-color:#262624}
html.enc-oscuro aside img{background:#fff;border-radius:.5rem;padding:.375rem}

html.enc-oscuro .enc-tema:hover{background:#30302e;border-color:#4a4844;color:#f6cf80}
/* Encabezado y filtros */
html.enc-oscuro .enc-fijo{background:rgba(31,30,29,.95)}
html.enc-oscuro .enc-caja,html.enc-oscuro .enc-panel{background:#262624;border-color:#3a3936}
html.enc-oscuro .enc-panel{box-shadow:0 16px 40px -12px rgba(0,0,0,.6)}

html.enc-oscuro .kpi-teal .kpi-n{color:#5fd1c0}html.enc-oscuro .kpi-teal svg{color:#2bb3a0}
html.enc-oscuro .kpi-indigo .kpi-n{color:#a5b4fc}html.enc-oscuro .kpi-indigo svg{color:#818cf8}

html.enc-oscuro .enc-met-l{color:#a29e96}
html.enc-oscuro .enc-met-bar{background:#34332f}
html.enc-oscuro .enc-sem-v{color:#34c58f}html.enc-oscuro .enc-sem-a{color:#e9a93c}html.enc-oscuro .enc-sem-r{color:#f07272}html.enc-oscuro .enc-sem-n{color:#bcb8b0}

/* uso-movil */
